<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tugas Web - Lucky Akbar Febriano</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          "Segoe UI",
          -apple-system,
          BlinkMacSystemFont,
          Roboto,
          sans-serif;
      }

      body {
        background-color: #0a0a0f;
        color: #f3f0fa;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        background: #17141f;
        padding: 35px 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        border: 1px solid #2a2140;
        width: 100%;
        max-width: 480px;
      }

      .header {
        background: linear-gradient(135deg, #a855f7, #7e22ce);
        padding: 16px;
        border-radius: 8px;
        text-align: center;
        margin-bottom: 12px;
      }

      h1 {
        font-size: 1.35rem;
        color: #ffffff;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      p.subtitle {
        font-size: 0.88rem;
        color: #b6aecb;
        text-align: center;
        margin-bottom: 28px;
      }

      ul {
        list-style: none;
      }

      li {
        margin-bottom: 12px;
      }

      a {
        display: block;
        padding: 13px 18px;
        background-color: #2a2140;
        color: #f3f0fa;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        text-align: center;
        transition: all 0.2s ease-in-out;
        border: 1px solid transparent;
      }

      /* Saat tombol diarahkan kursor / diklik: berubah jadi ungu terang */
      a:hover,
      a:active {
        background-color: #a855f7;
        color: #ffffff;
        border-color: #a78bfa;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(168, 85, 247, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Jobsheet Desain & Pemrograman Web — Lucky Akbar Febriano</h1>
      </div>
      <p class="subtitle">Desain & Pemrograman Web — Lucky Akbar Febriano</p>

      <ul>
        <li><a href="./jobsheet1/">Jobsheet 1</a></li>
        <li><a href="./jobsheet2/">Jobsheet 2</a></li>
        <li><a href="./jobsheet3/">Jobsheet 3</a></li>
        <li><a href="./jobsheet3bootstrap/">Jobsheet 3 (Bootstrap)</a></li>
        <li><a href="./jobsheet4/">Jobsheet 4</a></li>
        <li><a href="./jobsheet5/">Jobsheet 5</a></li>
        <li><a href="./jobsheet6/">Jobsheet 6</a></li>
        <li>
          <a
            href="https://github.com/luckyakbarfebriano/Desain-n-Pemrograman-Web/tree/main/jobsheet7"
            target="_blank"
            >Jobsheet 7 (lihat kode di GitHub)</a
          >
        </li>
        <li>
          <a
            href="https://github.com/luckyakbarfebriano/Desain-n-Pemrograman-Web/tree/main/jobsheet8"
            target="_blank"
            >Jobsheet 8 (lihat kode di GitHub)</a
          >
        </li>
      </ul>
    </div>
  </body>
</html>
