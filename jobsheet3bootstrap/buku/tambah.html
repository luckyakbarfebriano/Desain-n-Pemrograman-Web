<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMPUS-kecil || Tambah Buku</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <header
      class="navbar navbar-expand-lg navbar-dark"
      style="background-color: #1d5b8a"
    >
      <div class="container">
        <a class="navbar-brand" href="../index.html">SIMPUS-kecil</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
          aria-controls="navMenu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <nav class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="list.html">Daftar Buku</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="tambah.html">Tambah Buku</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../anggota/list.html">Daftar Anggota</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container my-4">
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="card-title mb-3">Tambah Buku</h2>
          <form>
            <div class="mb-3">
              <label for="judul" class="form-label">Judul</label>
              <input
                type="text"
                class="form-control"
                id="judul"
                name="judul"
                required
              />
            </div>
            <div class="mb-3">
              <label for="pengarang" class="form-label">Pengarang</label>
              <input
                type="text"
                class="form-control"
                id="pengarang"
                name="pengarang"
                required
              />
            </div>
            <div class="mb-3">
              <label for="tahun" class="form-label">Tahun Terbit</label>
              <input
                type="number"
                class="form-control"
                id="tahun"
                name="tahun"
                required
              />
            </div>
            <div class="mb-3">
              <label for="isbn" class="form-label">ISBN</label>
              <input
                type="text"
                class="form-control"
                id="isbn"
                name="isbn"
                required
              />
            </div>
            <div class="mb-3">
              <label for="stok" class="form-label">Stok</label>
              <input
                type="number"
                class="form-control"
                id="stok"
                name="stok"
                required
              />
            </div>
            <div class="mb-3">
              <label for="Kategori" class="form-label">Kategori</label>
              <select
                class="form-select"
                id="Kategori"
                name="Kategori"
                required
              >
                <option value="Fiksi">Fiksi</option>
                <option value="Non-Fiksi">Non-Fiksi</option>
                <option value="Referensi">Referensi</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Simpan</button>
          </form>
        </div>
      </div>
    </main>

    <footer class="text-center text-secondary py-3 small">
      <p class="mb-0">
        &copy; 2026 SIMPUS-kecil &mdash; Jobsheet 3 (Bootstrap)
      </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
