<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <div class="shell">
      <div class="sidebar-overlay" id="sidebar-overlay"></div>
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark">🏋️</span>
          <span class="brand-name">WE GO GYM</span>
        </div>
        <nav class="side-nav">
                <a href="../index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Home</span></a>
                <a href="../kelas/list.html" class="nav-item"><span class="nav-icon">🏋️</span><span>Daftar Kelas</span></a>
                <a href="../kelas/tambah.html" class="nav-item active"><span class="nav-icon">➕</span><span>Tambah Kelas</span></a>
                <a href="../anggota/list.html" class="nav-item"><span class="nav-icon">👥</span><span>Daftar Anggota</span></a>
                <a href="../anggota/tambah.html" class="nav-item"><span class="nav-icon">➕</span><span>Tambah Anggota</span></a>
        </nav>
        <div class="sidebar-footer">
          <a href="../../index.html" class="back-to-menu">&larr; Kembali ke Menu</a>
        </div>
      </aside>
      <div class="content-area">
        <div class="topbar">
          <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
          <div class="topbar-title">Tambah Kelas</div>
          <div class="topbar-user">
            <span class="guest-tag">Mode Tanpa Login (Bootstrap demo)</span>
          </div>
        </div>
        <main class="dashboard-main">
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="card-title mb-3">Tambah Kelas</h2>
          <form>
            <div class="mb-3">
              <label for="nama_kelas" class="form-label">Nama Kelas</label>
              <input
                type="text"
                class="form-control"
                id="nama_kelas"
                name="nama_kelas"
                required
              />
            </div>
            <div class="mb-3">
              <label for="instruktur" class="form-label">Instruktur</label>
              <input
                type="text"
                class="form-control"
                id="instruktur"
                name="instruktur"
                required
              />
            </div>
            <div class="mb-3">
              <label for="jadwal" class="form-label">Jadwal</label>
              <input
                type="text"
                class="form-control"
                id="jadwal"
                name="jadwal"
                required
              />
            </div>
            <div class="mb-3">
              <label for="kapasitas" class="form-label">Kapasitas</label>
              <input
                type="number"
                class="form-control"
                id="kapasitas"
                name="kapasitas"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary">Simpan</button>
          </form>
        </div>
      </div>
    </main>

        <footer>
          <p>&copy; 2026 WE GO GYM &mdash; Jobsheet 3 (Bootstrap)</p>
        </footer>
      </div>
    </div>
    <script src="../assets/js/shell.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
