<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <div class="shell">
      <div class="sidebar-overlay" id="sidebar-overlay"></div>
      <aside class="sidebar" id="sidebar">
        <div>
          <a href="../../index.html" class="back-link">&larr; Kembali ke Menu</a>
          <h1 class="brand-title">WE GO GYM</h1>
          <nav class="side-nav">
            <a href="../index.html" class="nav-item"><i class="fa-solid fa-house"></i> Beranda</a>
            <a href="../kelas/list.html" class="nav-item active"><i class="fa-solid fa-list-check"></i> Daftar Kelas</a>
            <a href="../anggota/list.html" class="nav-item"><i class="fa-regular fa-user"></i> Member</a>
          </nav>
        </div>
      </aside>

      <main class="content-area">
        <div class="mobile-bar">
          <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
          <span class="mobile-brand">WE GO GYM</span>
        </div>
        <div class="page-header">
          <h2 class="main-title">Tambah Kelas</h2>
          <div class="header-right">
            

          </div>
        </div>

        <div class="page-body">
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="card-title mb-3">Tambah Kelas</h2>
          <form>
            <div class="mb-3">
              <label for="nama_kelas" class="form-label">Nama Kelas</label>
              <input
                type="text"
                class="form-control"
                id="nama_kelas"
                name="nama_kelas"
                required
              />
            </div>
            <div class="mb-3">
              <label for="instruktur" class="form-label">Instruktur</label>
              <input
                type="text"
                class="form-control"
                id="instruktur"
                name="instruktur"
                required
              />
            </div>
            <div class="mb-3">
              <label for="jadwal" class="form-label">Jadwal</label>
              <input
                type="text"
                class="form-control"
                id="jadwal"
                name="jadwal"
                required
              />
            </div>
            <div class="mb-3">
              <label for="kapasitas" class="form-label">Kapasitas</label>
              <input
                type="number"
                class="form-control"
                id="kapasitas"
                name="kapasitas"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary">Simpan</button>
          </form>
        </div>
      </div>

</div>

        <footer>&copy; 2026 WE GO GYM &mdash; Jobsheet 3 (Bootstrap).</footer>
      </main>
    </div>
    <script src="../assets/js/shell.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
