<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WE GO GYM || Daftar Anggota</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <div class="shell">
      <div class="sidebar-overlay" id="sidebar-overlay"></div>
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark">🏋️</span>
          <span class="brand-name">WE GO GYM</span>
        </div>
        <nav class="side-nav">
                <a href="../index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Home</span></a>
                <a href="../kelas/list.html" class="nav-item"><span class="nav-icon">🏋️</span><span>Daftar Kelas</span></a>
                <a href="../kelas/tambah.html" class="nav-item"><span class="nav-icon">➕</span><span>Tambah Kelas</span></a>
                <a href="../anggota/list.html" class="nav-item active"><span class="nav-icon">👥</span><span>Daftar Anggota</span></a>
                <a href="../anggota/tambah.html" class="nav-item"><span class="nav-icon">➕</span><span>Tambah Anggota</span></a>
        </nav>
        <div class="sidebar-footer">
          <a href="../../index.html" class="back-to-menu">&larr; Kembali ke Menu</a>
        </div>
      </aside>
      <div class="content-area">
        <div class="topbar">
          <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
          <div class="topbar-title">Daftar Anggota</div>
          <div class="topbar-user">
            <span class="guest-tag">Mode Tanpa Login</span>
          </div>
        </div>
        <main class="dashboard-main">
      <section>
        <h2>Daftar Anggota</h2>
        <div class="search-box">
          <label for="search-input">Cari Nama Anggota</label>
          <input
            type="text"
            id="search-input"
            placeholder="Ketik nama anggota..."
          />
        </div>
        <p id="loading-indicator" style="display: none">Memuat data...</p>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>No Anggota</th>
                <th>Nama</th>
                <th>Alamat</th>
                <th>No HP</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody>
              <!-- Baris diisi dinamis oleh assets/js/anggota.js via fetch('../data/anggota.json') -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

        <footer>
          <p>&copy; 2026 WE GO GYM &mdash; Jobsheet 6.</p>
        </footer>
      </div>
    </div>
    <script src="../assets/js/shell.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/anggota.js"></script>
  </body>
</html>
