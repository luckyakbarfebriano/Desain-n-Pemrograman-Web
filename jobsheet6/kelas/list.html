<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WE GO GYM || Daftar Kelas</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <a href="../../index.html" class="back-to-menu">&larr; Kembali ke Menu</a>
    <header>
      <h1>WE GO GYM</h1>
      <button
        type="button"
        id="nav-toggle-btn"
        class="nav-toggle-label"
        aria-label="Menu"
      >
        &#9776;
      </button>
      <nav>
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="list.html">Daftar Kelas</a></li>
          <li><a href="tambah.html">Tambah Kelas</a></li>
          <li><a href="../anggota/list.html">Daftar Anggota</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Daftar Kelas</h2>
        <div class="search-box">
          <label for="search-input">Cari Nama Kelas</label>
          <input
            type="text"
            id="search-input"
            placeholder="Ketik nama kelas..."
          />
        </div>
        <p id="loading-indicator" style="display: none">Memuat data...</p>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Nama Kelas</th>
                <th>Instruktur</th>
                <th>Jadwal</th>
                <th>Kapasitas</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody>
              <!-- Baris diisi dinamis oleh assets/js/kelas.js via fetch('../data/kelas.json') -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 WE GO GYM &mdash; Jobsheet 6.</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/kelas.js"></script>
  </body>
</html>
