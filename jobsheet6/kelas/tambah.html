<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WE GO GYM || Tambah Kelas</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <a href="../../index.html" class="back-to-menu">&larr; Kembali ke Menu</a>
    <header>
      <h1>WE GO GYM</h1>
      <button
        type="button"
        id="nav-toggle-btn"
        class="nav-toggle-label"
        aria-label="Menu"
      >
        &#9776;
      </button>
      <nav>
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="list.html">Daftar Kelas</a></li>
          <li><a href="tambah.html" class="active">Tambah Kelas</a></li>
          <li><a href="../anggota/list.html">Daftar Anggota</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Tambah Kelas</h2>
        <form id="form-tambah">
          <p>
            <label for="nama_kelas">Nama Kelas:</label>
            <input type="text" id="nama_kelas" name="nama_kelas" required />
          </p>
          <p>
            <label for="instruktur">Instruktur:</label>
            <input type="text" id="instruktur" name="instruktur" required />
          </p>
          <p>
            <label for="jadwal">Jadwal:</label>
            <input
              type="text"
              id="jadwal"
              name="jadwal"
              placeholder="cth: Senin & Rabu, 07:00"
              required
            />
          </p>
          <p>
            <label for="kapasitas">Kapasitas:</label>
            <input
              type="number"
              id="kapasitas"
              name="kapasitas"
              min="0"
              required
            />
          </p>
          <p>
            <button type="submit">Simpan</button>
          </p>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 WE GO GYM &mdash; Jobsheet 6.</p>
    </footer>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
